<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip A Coin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300 font-sans relative overflow-x-hidden p-4 sm:p-6">

    <div class="absolute top-4 left-4 text-xs sm:text-sm font-semibold tracking-wider text-slate-500 dark:text-slate-400">
        R3-DEV©
    </div>

    <div class="absolute top-4 right-4 flex items-center space-x-3">
        <div class="flex items-center space-x-1.5 bg-slate-200 dark:bg-slate-800 p-1 rounded-full text-xs font-medium">
            <span class="px-2 py-0.5 text-slate-700 dark:text-slate-300">EN</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="langToggle" class="sr-only peer">
                <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-teal-600"></div>
            </label>
            <span class="px-2 py-0.5 text-slate-700 dark:text-slate-300">বাং</span>
        </div>

        <button id="themeToggle" class="p-2 rounded-full bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors focus:outline-none" aria-label="Toggle Theme">
		
            <svg id="sunIcon" class="w-5 h-5 hidden dark:block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
        
            <svg id="moonIcon" class="w-5 h-5 block dark:hidden text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </button>
    </div>

    <main class="flex-grow flex items-center justify-center my-auto px-2">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-lg p-6 sm:p-8 max-w-sm w-full text-center space-y-6 transition-all duration-300">
            
            <h1 id="titleText" class="text-xl sm:text-2xl font-bold tracking-wide">WELCOME TO FLIP A COIN</h1>

            <button id="flipButton" class="w-full bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:ring-offset-2 dark:focus:ring-offset-slate-800">
                <span id="buttonText">Flip</span>
            </button>

            <div class="min-h-[2.5rem] flex items-center justify-center">
                <span id="resultLabel" class="text-xl sm:text-2xl font-extrabold tracking-wider text-teal-600 dark:text-teal-400"></span>
            </div>

        </div>
    </main>

    <footer class="w-full text-center pt-4 border-t border-slate-200 dark:border-slate-800 mt-auto">
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Made By Raiyan Muhit. Do not copy this project!</p>
    </footer>

    <div class="absolute bottom-3 right-4 text-xs font-mono text-slate-400 dark:text-slate-500">
        v0.1
    </div>

    <script src="script.js"></script>
</body>
</html>
